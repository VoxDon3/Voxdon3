<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>VoxDon PS5 Host</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  min-height:100vh;
  background:#03050c url('background.jpg') center/cover no-repeat fixed;
  font-family:'Segoe UI',system-ui,sans-serif;
  color:#eef3ff;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  position:relative;
}
body::before{
  content:'';
  position:absolute;inset:0;
  background:radial-gradient(circle at 50% 40%,rgba(3,5,12,.25) 0%,rgba(3,5,12,.7) 55%,rgba(0,0,0,.88) 100%);
  z-index:0;
}
.box{
  position:relative;z-index:5;
  width:92%;max-width:460px;
  text-align:center;
  padding:28px 22px;
  background:rgba(8,12,24,.72);
  border:1px solid rgba(120,170,255,.22);
  border-radius:22px;
  backdrop-filter:blur(12px);
  box-shadow:0 25px 60px rgba(0,0,0,.55);
}
.brand{
  font-size:2.6rem;
  font-weight:800;
  letter-spacing:6px;
  background:linear-gradient(90deg,#fff 0%,#9ec5ff 60%,#6ea8ff 100%);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  margin-bottom:4px;
}
.tag{
  font-size:.95rem;
  color:#8fa8c8;
  letter-spacing:2px;
  margin-bottom:26px;
}
.status{
  background:rgba(0,0,0,.35);
  border-radius:14px;
  padding:18px 16px;
  margin-bottom:20px;
  border:1px solid rgba(100,150,255,.15);
}
#mainText{
  font-size:1.2rem;
  font-weight:700;
  color:#7eb6ff;
  margin-bottom:6px;
}
#subText{
  font-size:.88rem;
  color:#9aafc8;
  line-height:1.4;
}
.bar-bg{
  width:100%;
  height:5px;
  background:rgba(255,255,255,.08);
  border-radius:10px;
  margin-top:14px;
  overflow:hidden;
}
.bar{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,#3b8cff,#8ec5ff);
  border-radius:10px;
  transition:width .45s ease;
}
.note{
  font-size:.84rem;
  color:#7a90ab;
  line-height:1.55;
}
.note b{color:#a8c6ff}
.footer{
  position:absolute;
  bottom:14px;left:0;right:0;
  text-align:center;
  font-size:.75rem;
  color:#5a6d88;
  z-index:5;
}
.footer b{color:#8fa8c8}
@media(max-width:420px){
  .brand{font-size:2.1rem;letter-spacing:4px}
  #mainText{font-size:1.1rem}
}
</style>
</head>
<body>
  <div class="box">
    <div class="brand">VOX DON</div>
    <div class="tag">PS5 WEBKIT • FREE</div>

    <div class="status">
      <div id="mainText">جاري التهيئة...</div>
      <div id="subText">الرجاء الانتظار قليلاً</div>
      <div class="bar-bg"><div class="bar" id="bar"></div></div>
    </div>

    <div class="note">
      بعد نجاح الاستغلال سيتم التوجيه إلى<br>
      <b>Payload Manager</b><br>
      أرسل الملف أو انتظر التحميل التلقائي
    </div>
  </div>

  <div class="footer">Powered by <b>VoxDon</b> • Auto Run</div>

<script>
(function(){
  const main = document.getElementById('mainText');
  const sub  = document.getElementById('subText');
  const bar  = document.getElementById('bar');

  // رابط الاستغلال
  const target = "https://jordyidk.github.io/slopkit/slopkit/poops.html?go=1&auto=1&trigger=netcontrol&payload=1&v=41";

  function set(p, t, s){
    bar.style.width = p + '%';
    if(t) main.textContent = t;
    if(s) sub.textContent = s;
  }

  set(12, "جاري التهيئة...", "تحضير بيئة WebKit");
  setTimeout(()=> set(38, "تشغيل تلقائي...", "لا حاجة للضغط على أي زر"), 650);
  setTimeout(()=> set(67, "تجهيز الاستغلال...", "الانتقال إلى الجلبريك"), 1300);
  setTimeout(()=> {
    set(100, "بدء الجلبريك...", "بعد النجاح → Payload Manager");
    setTimeout(()=> location.replace(target), 550);
  }, 1950);
})();
</script>
</body>
</html>
